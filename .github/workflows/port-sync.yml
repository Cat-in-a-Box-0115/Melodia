name: Port sync & release

# 每天把本分支（macOS 适配、侧栏隐藏、英文界面）的提交重放到上游 dev 最新代码上，
# 打 Android、macOS 与 Windows 安装包并发布 Release。分支本身不被改写：重放只发生在 CI 工作区里，
# 上游变化与本分支冲突时开 issue 等人工合并，不发布。
on:
  schedule:
    # Twice a month (1st and 15th); run it by hand from the Actions tab for anything sooner
    - cron: '30 3 1,15 * *'
  push:
    branches: [feat/macos-desktop]
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: port-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/rinchao0721/Melodia.git
  UPSTREAM_BRANCH: dev

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
    steps:
      # GitHub turns off scheduled workflows after 60 days without repository activity
      - name: Keep the scheduled sync enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/port-sync.yml/enable"

      - uses: actions/checkout@v7
        with:
          ref: feat/macos-desktop
          fetch-depth: 0

      - name: Replay port commits onto upstream
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "port-sync"
          git config user.email "port-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --tags upstream "$UPSTREAM_BRANCH"
          if ! git rebase "upstream/$UPSTREAM_BRANCH"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            STOPPED=$(git log -1 --format='%h %s' REBASE_HEAD 2>/dev/null || echo unknown)
            git rebase --abort
            TITLE="Upstream sync needs a manual merge"
            BODY=$(printf 'Replaying the port onto `%s` (%s) stopped at:\n\n`%s`\n\nConflicting files:\n%s\n\nRun locally:\n```\ngit fetch upstream && git rebase upstream/%s\n```\nResolve, then push `feat/macos-desktop`. Run: %s' \
              "$UPSTREAM_BRANCH" "$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" "$STOPPED" "$CONFLICTS" "$UPSTREAM_BRANCH" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
            exit 1
          fi
          git branch -f port HEAD
          git bundle create port.bundle port

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          UPSTREAM_SHA=$(git rev-parse --short=8 "upstream/$UPSTREAM_BRANCH")
          PORT_SHA=$(git rev-parse --short=8 "origin/feat/macos-desktop")
          # Stable tags are made on upstream's main, so they aren't reachable from dev; take the newest overall
          UPSTREAM_TAG=$(git -c versionsort.suffix=- tag --sort=-v:refname --list 'v*.*.*' | head -1)
          AHEAD=$(git rev-list --count "$UPSTREAM_TAG..upstream/$UPSTREAM_BRANCH")
          VERSION=${UPSTREAM_TAG#v}
          TAG="port-${UPSTREAM_TAG}+${AHEAD}-${PORT_SHA}"
          SKIP=false
          # Rebuild until the release has every package, so a day without a Mac runner gets filled in later
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          SKIP=$([ "$FORCE" != "true" ] && echo true || echo false)
          for SUFFIX in '-android\.apk' '-macos-arm64\.dmg' '-windows-x64\.zip' '-windows-x64-setup\.exe'; do
            echo "$ASSETS" | grep -q "$SUFFIX\$" || SKIP=false
          done
          # The macOS job may fail without failing the run, so report when packages stop arriving
          LAST_DMG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '[.[] | select(any(.assets[]; .name | endswith(".dmg")))][0].published_at // empty')
          if [ -z "$LAST_DMG" ] || [ "$(date -d "$LAST_DMG" +%s)" -lt "$(date -d '35 days ago' +%s)" ]; then
            TITLE="macOS package missing for over a month"
            if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')" ]; then
              gh issue create --title "$TITLE" --body "The last release with a DMG was published at ${LAST_DMG:-unknown}. Check whether the macos job in Port sync & release is failing on a build error, or GitHub still has no Mac runners free: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/port-sync.yml"
            fi
          fi
          {
            echo "skip=$SKIP"; echo "tag=$TAG"; echo "version=$VERSION"
            echo "upstream_tag=$UPSTREAM_TAG+$AHEAD"; echo "upstream_sha=$UPSTREAM_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG (skip=$SKIP)"

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: port.bundle
          retention-days: 1

  android:
    needs: sync
    if: needs.sync.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
      - name: Check out replayed source
        run: git clone -q -b port port.bundle src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf %s "$KEYSTORE" | base64 -d > src/melodia-release.jks
      - name: Build APK
        working-directory: src
        env:
          RELEASE_STORE_FILE: melodia-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Same formula as VersionCodeResolver, so the in-app update check compares like with like
          V=${{ needs.sync.outputs.version }}
          IFS=. read -r MAJOR MINOR PATCH <<< "${V%%-*}"
          case "$V" in
            *-beta.*) SUB=${V##*.} ;;
            *-rc.*) SUB=$(( 50 + ${V##*.} )) ;;
            *) SUB=99 ;;
          esac
          ./gradlew :shared:desktopTest --tests '*VersionCodeResolverTest*' --tests '*UpdateRepositoryTest*' --no-daemon
          ./gradlew :app:assembleRelease \
            -PreleaseVersionName="$V" \
            -PreleaseVersionCode=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + SUB )) \
            -PreleaseApplicationId=com.lin0721.linmusic.port \
            --no-daemon
      # Missing signing secrets silently fall back to a debug key, which would break updates
      - name: Check signature
        run: |
          APK=$(ls src/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)/apksigner
          DN=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate DN')
          echo "$DN"
          if echo "$DN" | grep -qi "Android Debug"; then exit 1; fi
      - name: Remove signing key
        if: always()
        run: rm -f src/melodia-release.jks
      - name: Collect
        run: |
          mkdir dist
          cp src/app/build/outputs/apk/release/*.apk "dist/Melodia-${{ needs.sync.outputs.tag }}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          retention-days: 7

  macos:
    needs: sync
    if: needs.sync.outputs.skip != 'true'
    runs-on: macos-15
    # GitHub often has no Mac runner free; that must not block the other packages
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
      - name: Check out replayed source
        run: git clone -q -b port port.bundle src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install libmpv
        run: brew install mpv dylibbundler
      - name: Build DMG
        working-directory: src
        run: ./gradlew :desktopApp:packageReleaseDmg -PreleaseVersionName=${{ needs.sync.outputs.version }} --no-daemon
      - name: Collect
        run: |
          mkdir dist
          cp src/desktopApp/build/compose/binaries/main-release/dmg/*.dmg "dist/Melodia-${{ needs.sync.outputs.tag }}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          retention-days: 7

  windows:
    needs: sync
    if: needs.sync.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
      - name: Check out replayed source
        run: git clone -q -b port port.bundle src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build installer and zip
        working-directory: src
        run: |
          ./gradlew :desktopApp:packageReleaseZip :desktopApp:packageReleaseSetup \
            -PreleaseVersionName=${{ needs.sync.outputs.version }} \
            -PrequireSmtc=true -PrequireUninstaller=true --no-daemon
      - name: Collect
        run: |
          OUT=src/desktopApp/build/compose/binaries/main-release
          mkdir dist
          cp "$OUT"/zip/*.zip "dist/Melodia-${{ needs.sync.outputs.tag }}-windows-x64.zip"
          cp "$OUT"/setup/*.exe "dist/Melodia-${{ needs.sync.outputs.tag }}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          retention-days: 7

  release:
    needs: [sync, android, macos, windows]
    if: always() && needs.sync.result == 'success' && needs.sync.outputs.skip != 'true' && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{android,macos,windows}'
          merge-multiple: true
      - name: Release notes
        run: |
          cat > notes.md <<EOF
          Melodia built from upstream \`${UPSTREAM_BRANCH}\` at **${{ needs.sync.outputs.upstream_tag }}** (\`${{ needs.sync.outputs.upstream_sha }}\`) plus this fork's changes:

          - Native macOS (Apple Silicon) support: system traffic lights, Dock menu with playback controls, Melodia › Settings… (⌘,)
          - Fully hideable side panels with edge tabs that appear when the pointer nears the window edge
          - English UI: Settings › System › 语言 / Language (restart to apply)

          - Android: fixes FLAC songs playing at double speed with noise on Samsung phones

          **Android:** installs as a separate app next to the official Melodia. Updates install over the previous port build.
          **macOS:** if the DMG is missing, GitHub had no Mac runner free; a later run adds it. The app isn't notarized. After copying it to Applications, run \`xattr -dr com.apple.quarantine /Applications/Melodia.app\` once if macOS says it's damaged or can't be opened.
          **Windows:** unsigned; on a SmartScreen prompt choose More info › Run anyway.
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          name: Melodia port ${{ needs.sync.outputs.upstream_tag }}
          target_commitish: feat/macos-desktop
          body_path: notes.md
          prerelease: ${{ contains(needs.sync.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.sync.outputs.version, '-') }}
          files: dist/*
